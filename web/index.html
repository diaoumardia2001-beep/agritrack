<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Plateforme moderne de suivi de cheptel et de gestion des dépenses pour les éleveurs de Côte d'Ivoire.">
  <meta name="theme-color" content="#1B5E20">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AgriTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon & Icons officiels AgriTrack -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico">

  <title>AgriTrack — Gestion & Suivi de Cheptel</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Synchronisation immédiate avec le thème SharedPreferences enregistré dans window.localStorage
    (function() {
      try {
        var rawMode = localStorage.getItem('flutter.agritrack_theme_mode');
        if (rawMode && (rawMode.startsWith('"') && rawMode.endsWith('"'))) {
          rawMode = rawMode.slice(1, -1);
        }
        var isDark = false;
        if (rawMode === 'dark') {
          isDark = true;
        } else if (rawMode === 'light') {
          isDark = false;
        } else if (rawMode === 'system') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          // Mode clair par défaut AgriTrack (conforme à ThemeMode.light dans theme_provider.dart)
          isDark = false;
        }
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    /* ─── Tokens Design System AgriTrack (alignés sur AppColors) ───
       Mode Clair officiel par défaut (aligné sur AppColors.lightBackground : #F8FAF6)
       - lightBackground: #F8FAF6
       - lightPrimary: #1B5E20
       - lightTextPrimary: #141E15
       - lightAccent: #B45309
       - lightTextSecondary: #415243
       - lightCardBorder: #E0E7DE
    */
    body {
      margin: 0;
      background-color: #F8FAF6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #agritrack-boot-splash {
      position: fixed;
      inset: 0;
      background-color: #F8FAF6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.15s ease-out;
    }
    .agri-logo-box {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(to bottom, #C4F75C, #A9E82C);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(169, 232, 44, 0.35);
      margin-bottom: 18px;
    }
    .agri-logo-svg {
      width: 44px;
      height: 44px;
      display: block;
    }
    .agri-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .agri-title-primary {
      color: #1B5E20;
    }
    .agri-title-text {
      color: #141E15;
    }
    .agri-title-dot {
      color: #B45309;
    }
    .agri-subtitle {
      color: #415243;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .agri-spinner {
      width: 24px;
      height: 24px;
      border: 2.2px solid rgba(27, 94, 32, 0.18);
      border-top-color: #1B5E20;
      border-radius: 50%;
      animation: agrispin 0.75s linear infinite;
    }
    @keyframes agrispin {
      to { transform: rotate(360deg); }
    }

    /* ─── Mode Sombre (si data-theme="dark") ─── */
    html[data-theme="dark"] body,
    html[data-theme="dark"] #agritrack-boot-splash {
      background-color: #0D150F;
    }
    html[data-theme="dark"] .agri-logo-box {
      background: linear-gradient(to bottom, #C4F75C, #A9E82C);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.40);
    }
    html[data-theme="dark"] .agri-title-primary {
      color: #4ADE80;
    }
    html[data-theme="dark"] .agri-title-text {
      color: #F1F5F0;
    }
    html[data-theme="dark"] .agri-title-dot {
      color: #FBBF24;
    }
    html[data-theme="dark"] .agri-subtitle {
      color: #A6BCA8;
    }
    html[data-theme="dark"] .agri-spinner {
      border: 2.2px solid rgba(74, 222, 128, 0.18);
      border-top-color: #4ADE80;
    }
  </style>
</head>
<body>
  <!-- Écran d'accueil AgriTrack avant chargement des assets Flutter Web -->
  <div id="agritrack-boot-splash">
    <div class="agri-logo-box">
      <img src="icons/Icon-192.png" alt="AgriTrack Logo" width="76" height="76" style="border-radius: 20px; display: block;" />
    </div>
    <div class="agri-title"><span class="agri-title-primary">Agri</span><span class="agri-title-text">Track</span><span class="agri-title-dot">.</span></div>
    <div class="agri-subtitle">GESTION &amp; SUIVI DE CHEPTEL</div>
    <div class="agri-spinner"></div>
  </div>

  <script>
    // Écoute de l'initialisation du premier frame Flutter pour disparition immédiate
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('agritrack-boot-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 160);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
