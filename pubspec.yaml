name: agritrack
description: AgriTrack - Suivi de cheptel pour les éleveurs de Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  intl: ^0.20.0
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
