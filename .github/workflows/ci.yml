name: AgriTrack CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (for Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis (Zero Warnings)
        run: flutter analyze

      - name: 🧪 Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

      - name: 🌐 Build Web Artifact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://uzquikczddvawxsjwwuk.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_7jSX8EVtdXzzd9PbCKCcow_LPLUzqTP' }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agritrack-web-build
          path: build/web/
          if-no-files-found: ignore

      - name: 🤖 Build Android APK (Release)
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agritrack-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
